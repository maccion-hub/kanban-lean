name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: maccion-hub

jobs:
  # ── Quality checks ────────────────────────────────────────────────────────────
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check — API
        run: cd apps/api && npx tsc --noEmit
        continue-on-error: false

      - name: Type check — Web
        run: cd apps/web && npx tsc --noEmit
        continue-on-error: false

      - name: Unit tests — Kanban algorithm
        run: cd apps/api && npx jest --no-coverage --passWithNoTests

  # ── Build & Push Docker images ────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: .
            dockerfile: apps/api/Dockerfile
          - app: web
            context: .
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kanban-lean-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_KANBAN_API_URL }}

  # ── Deploy to staging ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: "/opt/kanban-lean"

      - name: Inject env vars + deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/kanban-lean

            # ── Fix template vars in compose file ────────────────────────────
            sed -i "s|\${{ env.IMAGE_OWNER }}|maccion-hub|g" docker-compose.staging.yml

            # ── Ensure .env exists with required vars ─────────────────────────
            touch .env
            grep -q "^POSTGRES_PASSWORD=" .env \
              || echo "POSTGRES_PASSWORD=${{ secrets.STAGING_KANBAN_POSTGRES_PASSWORD }}" >> .env
            sed -i '/^NEXT_PUBLIC_API_URL=/d' .env
            echo "NEXT_PUBLIC_API_URL=${{ secrets.STAGING_KANBAN_API_URL }}" >> .env
            grep -q "^ANTHROPIC_API_KEY=" .env \
              || echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env

            # ── Inject image tag ───────────────────────────────────────────────
            export IMAGE_TAG=sha-$(echo '${{ github.sha }}' | cut -c1-7)
            sed -i "s|IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            grep -q "^IMAGE_TAG=" .env || echo "IMAGE_TAG=${IMAGE_TAG}" >> .env

            # ── Pull + deploy ─────────────────────────────────────────────────
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml --env-file .env up -d --remove-orphans

            docker image prune -f

            # ── Run schema migration (one-shot) ───────────────────────────────
            echo "=== Running Prisma db push ==="
            docker compose -f docker-compose.staging.yml rm -f db-init 2>/dev/null || true
            docker compose -f docker-compose.staging.yml --env-file .env run --rm db-init \
              && echo "✅ Schema sincronitzat" \
              || echo "⚠️  db-init errors — comprova els logs"

            echo "✅ Deployed sha-${{ github.sha }}"
            docker compose -f docker-compose.staging.yml ps

            # ── Wait for web healthcheck ───────────────────────────────────────
            echo "Esperant que el web sigui healthy (màx 3 min)..."
            for i in $(seq 1 18); do
              sleep 10
              STATUS=$(docker compose -f docker-compose.staging.yml ps web --format "table {{.Status}}" 2>/dev/null | tail -1 || echo "unknown")
              echo "  [${i}0s] web: $STATUS"
              if echo "$STATUS" | grep -qi "healthy"; then
                echo "✅ Web healthy"
                break
              fi
              if echo "$STATUS" | grep -qi "unhealthy"; then
                echo "⚠️ Web unhealthy — logs:"
                docker compose -f docker-compose.staging.yml logs web 2>&1 | tail -50
                break
              fi
            done
            docker compose -f docker-compose.staging.yml ps
