services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kanban
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/maccion-hub/kanban-lean-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3011:3001"
    environment:
      DATABASE_URL: postgresql://kanban:${POSTGRES_PASSWORD}@postgres:5432/kanban?schema=public
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: claude-sonnet-4-6
      API_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/articles || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ghcr.io/maccion-hub/kanban-lean-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-init:
    image: ghcr.io/maccion-hub/kanban-lean-api:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://kanban:${POSTGRES_PASSWORD}@postgres:5432/kanban?schema=public
    command: ["sh", "-c", "cd apps/api && npx prisma db push --skip-generate"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
